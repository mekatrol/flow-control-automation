schemaVersion: 1
id: matrix-virtual-digital-valid
name: Matrix virtual digital valid
enabled: true
kind: virtual
connection: {}
tls: { verifyServerCertificate: true }
timeouts: { connectMilliseconds: 100 }
mappings:
  - id: values
    aliases: [value]
    read: {}
    virtual: { persistence: volatile }
points:
  - id: matrix-point
    name: Matrix point
    enabled: true
    direction: value
    valueType: digital
    stateLabels: { false: Off, true: On }
    readable: true
    commandable: false
    persistence: volatile
    mapping: values/value
