schemaVersion: 1
id: matrix-mqtt-multistate-valid
name: Matrix mqtt multiState valid
enabled: true
kind: mqtt
connection: { brokerUrl: mqtts://mqtt.example.test, qos: 1, testTopic: fixtures/state }
tls: { verifyServerCertificate: true }
timeouts: { connectMilliseconds: 100 }
mappings:
  - id: values
    aliases: [value]
    read: { topic: fixtures/state, qos: 1, format: json, template: '{ "value": {{ value }} }' }
points:
  - id: matrix-point
    name: Matrix point
    enabled: true
    direction: input
    valueType: multiState
    stateLabels: [{ key: idle, label: Idle }, { key: run, label: Running }]
    readable: true
    commandable: false
    persistence: volatile
    mapping: values/value
