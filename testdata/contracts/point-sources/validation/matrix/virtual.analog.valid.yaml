schemaVersion: 1
id: matrix-virtual-analog-valid
name: Matrix virtual analog valid
enabled: true
kind: virtual
connection: {}
tls: { verifyServerCertificate: true }
timeouts: { connectMilliseconds: 100 }
mappings:
  - id: values
    aliases: [value]
    read: {}
    virtual: { persistence: volatile }
points:
  - id: matrix-point
    name: Matrix point
    enabled: true
    direction: value
    valueType: analog
    units: percent
    limits: { minimum: 0, maximum: 100 }
    readable: true
    commandable: false
    persistence: volatile
    mapping: values/value
