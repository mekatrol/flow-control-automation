schemaVersion: 1
id: matrix-httpjson-digital-invalid
name: Matrix http digital invalid
enabled: true
kind: http
connection: { baseUrl: https://api.example.test, maximumResponseBytes: 1024 }
tls: { verifyServerCertificate: true }
timeouts: { connectMilliseconds: 100 }
mappings:
  - id: values
    aliases: [value]
    read: { path: /value, method: GET, responseFormat: json, template: '{ "value": {{ value }} }' }
points:
  - id: matrix-point
    name: Matrix point
    enabled: true
    direction: input
    valueType: digital
    readable: true
    commandable: false
    persistence: volatile
    mapping: values/value

