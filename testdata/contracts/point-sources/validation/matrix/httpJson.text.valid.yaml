schemaVersion: 1
id: matrix-httpjson-text-valid
name: Matrix httpJson text valid
enabled: true
kind: httpJson
connection: { baseUrl: https://api.example.test, maximumResponseBytes: 1024 }
tls: { verifyServerCertificate: true }
timeouts: { connectMilliseconds: 100 }
mappings:
  - id: values
    aliases: [value]
    read: { path: /value, method: GET, format: json, template: '{ "value": {{ value }} }' }
points:
  - id: matrix-point
    name: Matrix point
    enabled: true
    direction: input
    valueType: text
    limits: { maximumLength: 32 }
    readable: true
    commandable: false
    persistence: volatile
    mapping: values/value
