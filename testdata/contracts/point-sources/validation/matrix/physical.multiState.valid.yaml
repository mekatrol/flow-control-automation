schemaVersion: 1
id: matrix-physical-multistate-valid
name: Matrix physical multiState valid
enabled: true
kind: physical
connection: {}
tls: { verifyServerCertificate: true }
timeouts: { connectMilliseconds: 100 }
mappings:
  - id: values
    aliases: [value]
    read: {}
    physical: { controllerId: controller, channel: channel-1, address: "0", electricalType: voltage }
points:
  - id: matrix-point
    name: Matrix point
    enabled: true
    direction: input
    valueType: multiState
    stateLabels: [{ key: idle, label: Idle }, { key: run, label: Running }]
    readable: true
    commandable: false
    persistence: volatile
    mapping: values/value
