schemaVersion: 1
id: runtime-values
name: Runtime values
enabled: true
kind: virtual
connection: {}
tls: { verifyServerCertificate: true }
timeouts: { connectMilliseconds: 100 }
mappings:
  - id: local
    aliases: [mode, counter, shared]
    read: {}
    command: {}
    virtual: { persistence: retained }
points:
  - { id: operating-mode, name: Operating mode, enabled: true, direction: value, valueType: multiState, stateLabels: [{ key: "off", label: "Off" }, { key: heat, label: Heat }], readable: true, commandable: true, persistence: retained, relinquishDefault: "off", mapping: local/mode }
  - { id: cycle-count, name: Cycle count, enabled: true, direction: value, valueType: integer, units: cycles, readable: true, commandable: true, persistence: volatile, limits: { minimum: 0, maximum: 9007199254740991 }, mapping: local/counter }
  - { id: shared-count-text, name: Shared count text, enabled: true, direction: value, valueType: text, readable: true, commandable: false, persistence: volatile, limits: { maximumLength: 32 }, mapping: local/shared }
  - { id: shared-count-number, name: Shared count number, enabled: true, direction: value, valueType: integer, readable: true, commandable: false, persistence: volatile, mapping: local/shared }
