schemaVersion: 1
id: home-assistant
name: Home Assistant
enabled: true
kind: homeAssistant
connection:
  baseUrl: https://ha.example.test
  subscribeEvents: true
credentialRef: env:HOME_ASSISTANT_TOKEN
tls:
  verifyServerCertificate: true
timeouts:
  connectMilliseconds: 2000
  requestMilliseconds: 5000
mappings:
  - id: supply-fan
    aliases:
      - state
    read:
      entityId: switch.supply_fan
      property: state
    command:
      service: switch.turn_on
      serviceData:
        entity_id: switch.supply_fan
points:
  - id: supply-fan-enable
    name: Supply fan enable
    enabled: true
    direction: inputOutput
    valueType: digital
    stateLabels:
      false: Stopped
      true: Running
    readable: true
    commandable: true
    persistence: volatile
    safeDisablePolicy:
      startup: relinquish
      shutdown: relinquish
      communicationLoss: relinquish
      disable: relinquish
    mapping: supply-fan/state
