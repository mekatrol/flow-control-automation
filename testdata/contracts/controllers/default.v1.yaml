schemaVersion: 1
id: default
name: Flow Control Automation
description: Built-in unrestricted application target
readOnly: true
revision: 1
capabilities:
  pointTypes: [analog, digital, multi_state, integer, text]
  pointDirections: [input, output, input_output, value]
  pointFeatures: [read, command, retain, override, relinquish, quality, alarms, trends]
  connectorDataTypes: [any, boolean, event, number, string]
  flowFunctions:
    [and, average, calculator, calendar, clamp, comparator, delay, if,
     level-shifter, line, max, min, nand, nor, not, or, override, point-changed,
     pulse, read-point, release-point-command, schedule, selector, sequence,
     split, timer, write-point, xnor, xor]
  executionModes: [event, interval]
  runtimeFeatures: [virtual_points, bound_points, command_arbitration, quality_propagation]
limits:
  maxFlows: null
  maxNodesPerFlow: null
  maxConnectionsPerFlow: null
  minimumIntervalMilliseconds: null
