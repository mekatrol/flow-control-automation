     pulse, readPoint, releasePointCommand, schedule, selector, sequence,
     split, timer, writePoint, xnor, xor]
  executionModes: [event, interval]
  runtimeFeatures: [virtualPoints, boundPoints, commandArbitration, qualityPropagation]
limits:
  maxFlows: null
  maxNodesPerFlow: null
  maxConnectionsPerFlow: null
  minimumIntervalMilliseconds: null
